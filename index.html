<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Peovala: contact-centre workforce management demo with Erlang C forecasting, automatic shift scheduling, absence planning, time tracking and Excel exports.">
<title>Peovala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operator console — grouped module rail, a period/role bar on top, one working pane, side drawer for edits. */
:root{
  --bg:#f2f5f4; --surface:#fcfcfb; --sunk:#e9eeec; --ink:#14201f; --ink2:#4b5856; --muted:#7f8a88;
  --line:#dce2e0; --line2:#c5cdca; --accent:#0f6e6a; --accent-ink:#ffffff; --accent-soft:#d9ecea;
  --s1:#2a78d6; --s1-soft:#cde2fb; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --crit:#d03b3b; --crit-ink:#b42a2a;
  --div-neg:#e34948; --div-pos:#2a78d6; --div-mid:#eceeec;
  --b-early:#d6e8fb; --b-mid:#d9f0e6; --b-late:#fbe3d6; --b-abs:#ece6fa; --b-npto:#f3e1e3; --b-work:#e3ecef;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px; --shadow:0 8px 30px rgba(10,30,28,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1413; --surface:#161d1c; --sunk:#1c2524; --ink:#e9efed; --ink2:#b4c0bd; --muted:#7f8b88;
  --line:#26302e; --line2:#35403e; --accent:#3cb7ae; --accent-ink:#06201e; --accent-soft:#183a37;
  --s1:#3987e5; --s1-soft:#184f95; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
  --good-ink:#2fc52f; --warn-ink:#fab219; --crit-ink:#ef6a6a;
  --div-neg:#e66767; --div-pos:#3987e5; --div-mid:#2a3230;
  --b-early:#1b3550; --b-mid:#173a2d; --b-late:#45291b; --b-abs:#2e2748; --b-npto:#46262b; --b-work:#22333a; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1413; --surface:#161d1c; --sunk:#1c2524; --ink:#e9efed; --ink2:#b4c0bd; --muted:#7f8b88;
  --line:#26302e; --line2:#35403e; --accent:#3cb7ae; --accent-ink:#06201e; --accent-soft:#183a37;
  --s1:#3987e5; --s1-soft:#184f95; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
  --good-ink:#2fc52f; --warn-ink:#fab219; --crit-ink:#ef6a6a;
  --div-neg:#e66767; --div-pos:#3987e5; --div-mid:#2a3230;
  --b-early:#1b3550; --b-mid:#173a2d; --b-late:#45291b; --b-abs:#2e2748; --b-npto:#46262b; --b-work:#22333a; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:14px/1.5 var(--f-body); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; letter-spacing:-.01em}
.num,.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.nowrap{white-space:nowrap}

.app{display:grid; grid-template-columns:224px minmax(0,1fr); min-height:100%}
.rail{background:var(--surface); border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:16px; position:sticky; top:0; height:100vh; overflow-y:auto}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px}
.brand-mark{width:28px; height:28px; border-radius:6px; background:var(--accent); display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; flex:none}
.brand-mark i{display:block; width:3px; background:var(--accent-ink); margin:0 1px; border-radius:1px}
.brand-name{font-family:var(--f-display); font-weight:700; font-size:18px; letter-spacing:-.02em}
.nav{display:flex; flex-direction:column; gap:12px}
.nav-g{display:flex; flex-direction:column; gap:1px}
.nav-h{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:600; padding:0 10px 4px}
.nav button{all:unset; cursor:pointer; padding:7px 10px; border-radius:var(--r); color:var(--ink2); display:flex; justify-content:space-between; align-items:center; font-weight:500}
.nav button:hover{background:var(--sunk); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft); color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.badge{background:var(--crit); color:#fff; font-size:11px; font-weight:600; border-radius:99px; padding:0 7px; font-family:var(--f-mono)}
.rail-foot{margin-top:auto; font-size:12px; color:var(--muted); padding:0 8px; display:flex; flex-direction:column; gap:6px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:1px 8px; border-radius:99px; background:var(--sunk); color:var(--ink2); font-weight:500; white-space:nowrap; width:max-content}
.chip.demo{background:color-mix(in oklab, var(--warn) 22%, var(--surface)); color:var(--warn-ink)}

.col{min-width:0; display:flex; flex-direction:column}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:15; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 28px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between}
.period,.top-r{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.period input[type=date]{padding:4px 8px}
.undo{display:flex; gap:4px}
.pubchip{border:1px solid var(--line2); background:var(--surface); border-radius:99px; padding:4px 12px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--good-ink)}
.pubchip.draft{color:var(--warn-ink); border-color:color-mix(in oklab, var(--warn) 50%, var(--surface))}
.role{display:flex; align-items:center; gap:6px}
.main{padding-block:22px 64px; padding-inline:28px; min-width:0}
.head{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 20px; margin-bottom:16px}
.head h1{font-size:26px; font-weight:700}
.head p{margin:3px 0 0; color:var(--ink2); max-width:72ch}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600}
.actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}

.btn{border:1px solid var(--line2); background:var(--surface); padding:7px 12px; border-radius:var(--r); cursor:pointer; font-weight:500; white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit-ink)}
.btn.danger.armed{background:var(--crit); border-color:var(--crit); color:#fff}
.btn.sm{padding:3px 9px; font-size:13px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45; cursor:default}

.banner{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:var(--r); background:color-mix(in oklab, var(--warn) 16%, var(--surface)); border:1px solid color-mix(in oklab, var(--warn) 45%, var(--surface)); margin-bottom:16px}
.banner b{color:var(--warn-ink)}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; min-width:0}
.panel h2,.modal h2,.drawer h2{font-size:15px; font-weight:600; margin-bottom:2px}
.drawer h2{font-size:19px}
.modal h2{font-size:18px}
.panel .sub{color:var(--muted); font-size:12.5px; margin:0 0 12px}
.grid{display:grid; gap:14px; min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 320px}

.kpis{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:14px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface); padding:13px 16px; display:flex; flex-direction:column; gap:2px; min-width:0}
.kpi .v{font-family:var(--f-display); font-size:25px; font-weight:600; letter-spacing:-.02em; line-height:1.15}
.kpi .l{font-size:12px; color:var(--ink2)}
.kpi .d{font-size:12px; color:var(--muted)}

.tbl-wrap{overflow:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface); max-width:100%}
table{border-collapse:collapse; width:100%; font-size:13px}
th{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; white-space:nowrap; z-index:1}
td{padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
table.mini{font-size:12.5px}
table.mini th{padding:6px 8px; position:static}
table.mini td{padding:5px 8px}
.sub2{font-size:11.5px; color:var(--muted); font-family:var(--f-mono)}
.lnk{cursor:pointer; text-decoration:underline; text-decoration-color:var(--line2); text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--ink)}
.skill{font-family:var(--f-mono); font-size:10.5px; color:var(--accent); font-weight:500}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:1px 8px 1px 6px; border-radius:99px; white-space:nowrap}
.pill::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.pill.good{color:var(--good-ink); background:color-mix(in oklab, var(--good) 13%, var(--surface))}
.pill.warn{color:var(--warn-ink); background:color-mix(in oklab, var(--warn) 18%, var(--surface))}
.pill.crit{color:var(--crit-ink); background:color-mix(in oklab, var(--crit) 13%, var(--surface))}
.pill.neutral{color:var(--ink2); background:var(--sunk)}

.seg{display:inline-flex; border:1px solid var(--line2); border-radius:var(--r); overflow:hidden; background:var(--surface); flex-wrap:wrap; max-width:100%}
.seg button{all:unset; cursor:pointer; padding:5px 11px; font-size:13px; font-weight:500; color:var(--ink2); border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.seg .cnt{font-family:var(--f-mono); font-size:11px; opacity:.7}
.toolbar{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-bottom:12px}
.dstep{display:inline-flex; gap:4px; align-items:center}
.dstep select{min-width:150px}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field label,.flabel{font-size:12px; color:var(--ink2); font-weight:500}
.field .hint{font-size:11.5px; color:var(--muted)}
.check{display:inline-flex; align-items:center; gap:8px; font-size:13px; cursor:pointer}
.check.sm{font-size:12px; gap:4px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface); border:1px solid var(--line2); border-radius:var(--r); padding:6px 9px; min-width:0}
input[type=number]{font-family:var(--f-mono)}
textarea{font-family:var(--f-mono); font-size:12px; width:100%; min-height:200px; resize:vertical}
.form{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px}
.form-sec{margin-top:18px}
.form-sec:first-child{margin-top:0}
.form-sec h3{font-size:13px; font-weight:600; margin-bottom:10px; color:var(--ink2)}
.kv{display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-weight:500}
.kv.inline{grid-template-columns:repeat(3, max-content max-content); gap:4px 12px}
.note{border-radius:6px; padding:10px 12px; font-size:13px}
.note.crit{background:color-mix(in oklab, var(--crit) 10%, var(--surface)); color:var(--ink)}
.issues{margin:6px 0 0; padding-left:18px; color:var(--crit-ink); font-size:12.5px}
.ok{color:var(--good-ink); margin:4px 0 8px; font-size:13px}
.impact{display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--line); padding-top:10px}
.attn{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; font-size:13px}
.attn li{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:8px}
table.mini.cls td{padding:4px 4px} table.mini.cls select{padding:4px 4px}

/* charts */
.chart{position:relative; width:100%; min-width:0}
.chart svg{display:block; width:100%; overflow:visible}
.chart text{font-family:var(--f-mono); font-size:10.5px; fill:var(--muted)}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--ink2); margin-bottom:8px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{display:inline-block; width:12px; height:3px; border-radius:2px}
.legend i.box{height:10px; width:10px; border-radius:2px}
.legend i.dash{background:none!important; border-top:2px dashed currentColor; height:0}
.lockbox{background:repeating-linear-gradient(135deg, var(--s1-soft) 0 3px, var(--surface) 3px 6px); border:1px solid var(--s1)}
#tip{position:fixed; pointer-events:none; z-index:60; background:var(--surface); border:1px solid var(--line2); border-radius:6px; box-shadow:var(--shadow); padding:8px 10px; font-size:12px; min-width:150px; max-width:280px}
#tip .t{font-family:var(--f-mono); font-weight:500; margin-bottom:4px}
#tip .row{display:flex; justify-content:space-between; gap:14px; color:var(--ink2)}
#tip .row b{font-family:var(--f-mono); color:var(--ink); font-weight:500}
#tip .row i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px}

/* heatmap */
.heat{display:grid; gap:2px; font-size:11px}
.heat .lab{color:var(--muted); font-family:var(--f-mono); align-self:center; font-size:10.5px; white-space:nowrap}
.heat .c{height:var(--ch,20px); border-radius:2px; cursor:pointer}
.heat-x{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:10.5px; color:var(--muted); margin-top:4px}
.ramp{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink2)}
.ramp .bar{width:140px; height:8px; border-radius:2px; background:linear-gradient(to right, var(--div-neg), var(--div-mid), var(--div-pos))}

/* gantt */
.gantt{border:1px solid var(--line); border-radius:8px; background:var(--surface); overflow:hidden}
.g-row{display:grid; grid-template-columns:210px minmax(0,1fr) 60px; align-items:center; border-bottom:1px solid var(--line); min-height:36px}
.g-row:last-child{border-bottom:0}
.g-row.hd{min-height:28px; font-family:var(--f-mono); font-size:10.5px; color:var(--muted)}
.g-who{padding:4px 12px; min-width:0; cursor:pointer}
.g-who b{display:block; font-weight:500; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.g-who small{color:var(--muted); font-family:var(--f-mono); font-size:11px}
.g-row:not(.hd):hover{background:var(--sunk)}
.track{position:relative; height:36px; background-image:linear-gradient(to right, var(--line) 1px, transparent 1px); background-size:calc(100% / var(--hours)) 100%}
.track .sh{position:absolute; top:8px; height:20px; border-radius:4px; background:var(--s1-soft); border:1px solid color-mix(in oklab, var(--s1) 55%, transparent); touch-action:none}
.track .sh.locked{background:repeating-linear-gradient(135deg, var(--s1-soft) 0 4px, color-mix(in oklab, var(--s1-soft) 60%, var(--surface)) 4px 8px)}
.track.editable .sh{cursor:grab}
.track .sh.dragging{cursor:grabbing; box-shadow:0 0 0 2px var(--accent); z-index:3}
.track .sh.bad{box-shadow:0 0 0 2px var(--crit)}
.track .ac{position:absolute; top:-1px; bottom:-1px; border-left:1px solid var(--surface); border-right:1px solid var(--surface)}
.track.editable .ac{cursor:ew-resize}
.track .ac.B{background:var(--s2)} .track .ac.L{background:var(--s3)} .track .ac.M,.track .ac.T,.track .ac.C,.track .ac.O{background:var(--s7)}
.track .hl,.track .hr{position:absolute; top:0; bottom:0; width:7px; cursor:col-resize; z-index:2}
.track .hl{left:-3px} .track .hr{right:-3px}
.track.editable .sh:hover .hl,.track.editable .sh:hover .hr{background:color-mix(in oklab, var(--s1) 40%, transparent); border-radius:3px}
.track .off{position:absolute; inset:10px 0; display:flex; align-items:center; padding-left:8px; color:var(--muted); font-size:12px}
.g-hrs{text-align:right; padding-right:12px; font-family:var(--f-mono); font-size:12px; color:var(--ink2)}
.axis-row{position:relative; height:28px}
.axis-row span{position:absolute; top:7px; transform:translateX(-50%)}
.pager{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; font-size:13px; color:var(--ink2); flex-wrap:wrap}

/* roster */
.roster-wrap{max-height:70vh}
table.roster th,table.roster td{padding:5px 6px; text-align:center; font-size:12px}
table.roster th{font-size:10.5px; letter-spacing:.03em}
table.roster th.we{color:var(--ink2)} table.roster th.sp{color:var(--warn-ink)}
table.roster .stick{position:sticky; left:0; background:var(--surface); text-align:left; z-index:2; min-width:170px; border-right:1px solid var(--line)}
table.roster thead .stick{z-index:3}
table.roster td.cell{cursor:pointer; border-left:1px solid var(--line); min-width:58px; line-height:1.15}
table.roster td.cell b{display:block; font-family:var(--f-mono); font-weight:500; font-size:12px}
table.roster td.cell span{font-family:var(--f-mono); font-size:10.5px; color:var(--ink2)}
table.roster td.cell:hover{outline:2px solid var(--accent); outline-offset:-2px}
table.roster td.lk{box-shadow:inset 3px 0 0 var(--s1)}
.band-early{background:var(--b-early)} .band-mid{background:var(--b-mid)} .band-late{background:var(--b-late)} .band-abs{background:var(--b-abs)}
.legend i.band-early,.legend i.band-mid,.legend i.band-late,.legend i.band-abs{border:1px solid var(--line2)}

/* self-service */
.daygrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px}
.daycard{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:4px; border-top:4px solid var(--line2)}
.daycard.early{border-top-color:var(--s1)} .daycard.mid{border-top-color:var(--s3)} .daycard.late{border-top-color:var(--s2)} .daycard.abs{border-top-color:var(--s7)}
.dc-h{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:13px}
.dc-t{font-family:var(--f-display); font-size:20px; font-weight:600}
.daycard.off .dc-t{color:var(--muted)}
.dc-a{font-size:11.5px; color:var(--muted); font-family:var(--f-mono)}
.dc-f{display:flex; gap:4px; flex-wrap:wrap; margin-top:auto; padding-top:6px}

/* misc */
.teampick{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:4px; max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:8px; margin-top:6px}
.teampick label{display:flex; gap:6px; align-items:center; font-family:var(--f-mono); font-size:12px; cursor:pointer}
.rep-layout{display:grid; grid-template-columns:260px minmax(0,1fr); gap:14px}
.replist{display:flex; flex-direction:column; gap:4px}
.replist button{all:unset; cursor:pointer; padding:9px 12px; border-radius:6px; display:flex; flex-direction:column; gap:2px; border:1px solid transparent}
.replist button b{font-weight:600; font-size:13px}
.replist button span{font-size:12px; color:var(--muted)}
.replist button:hover{background:var(--sunk)}
.replist button[aria-pressed="true"]{background:var(--surface); border-color:var(--line2)}
.replist button:focus-visible{outline:2px solid var(--accent)}
table.allow td.zero{color:var(--crit-ink); font-weight:600} table.allow td.low{color:var(--warn-ink)}

/* overlays */
.scrim{position:fixed; inset:0; background:rgba(8,20,18,.38); z-index:30}

.drawer .body{padding:16px 18px; overflow:auto; flex:1; display:flex; flex-direction:column; gap:18px}
.drawer footer{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:space-between; flex-wrap:wrap}
.modal{position:fixed; z-index:31; left:50%; top:50%; transform:translate(-50%,-50%); width:min(680px,calc(100% - 32px)); max-height:calc(100% - 48px); background:var(--surface); border-radius:10px; box-shadow:var(--shadow); display:flex; flex-direction:column}

.modal header{padding:16px 18px 6px; display:flex; justify-content:space-between; gap:10px}
.modal .body{padding:8px 18px 12px; overflow:auto; display:flex; flex-direction:column; gap:12px}
.modal footer{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.x{all:unset; cursor:pointer; font-size:20px; line-height:1; color:var(--muted); padding:2px 6px; border-radius:4px}
.x:hover{background:var(--sunk); color:var(--ink)}
.busy{position:fixed; z-index:40; left:50%; top:40%; transform:translate(-50%,-50%); background:var(--surface); border-radius:10px; box-shadow:var(--shadow); padding:16px 20px; display:flex; gap:12px; align-items:center; font-weight:500; max-width:calc(100% - 32px)}
.spin{width:18px; height:18px; border-radius:50%; border:2px solid var(--line2); border-top-color:var(--accent); flex:none}
@media (prefers-reduced-motion: no-preference){ .spin{animation:sp .8s linear infinite} @keyframes sp{to{transform:rotate(360deg)}} .drawer{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px); opacity:.6}} }
#toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:9px 16px; border-radius:6px; font-size:13px; z-index:70; box-shadow:var(--shadow); max-width:calc(100% - 32px)}

/* time tracking */
.tc-PROD{--c:var(--s1)} .tc-BREAK{--c:var(--s2)} .tc-MEAL{--c:var(--s3)} .tc-MEET{--c:var(--s7)} .tc-TRB{--c:var(--s4)} .tc-TRN{--c:var(--s5)} .tc-COACH{--c:var(--s6)} .tc-OUT{--c:var(--line2)} .tc-TRAIN{--c:var(--s4)} .tc-OUTX{--c:var(--muted)}

.tcbtn{all:unset; box-sizing:border-box; cursor:pointer; border:1px solid var(--line2); border-radius:8px; padding:11px 12px; display:flex; align-items:center; gap:8px; font-weight:600; font-size:13.5px; background:var(--surface)}
.tcbtn .dot{width:10px; height:10px; border-radius:3px; background:var(--c); flex:none}
.tcbtn:hover{border-color:var(--ink2)}
.tcbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.tcbtn.on{background:color-mix(in oklab, var(--c) 18%, var(--surface)); border-color:var(--c)}

/* schedule views */

body.dragging-cell{cursor:grabbing; user-select:none}
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
